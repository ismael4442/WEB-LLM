<!DOCTYPE html>

<head>

    <main>

        <section class="formulario">
            <h1>Formulario de contacto</h1>
            <p>Rellena el formulario para contactar con nosotros.</p>

            <form>

                <label for="nombre">Nombre:</label>
                <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre">

                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" placeholder="ejemplo@correo.com">

                <label for="asunto">Asunto:</label>
                <input type="text" id="asunto" name="asunto" placeholder="Motivo del contacto">

                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" placeholder="Escribe tu mensaje"></textarea>

                <input type="submit" value="Enviar">

            </form>
        </section>

    </main>

    <footer>
        <p>CIFP Virgen de Gracia</p>
        <p>
            Contacto:
            <a href="mailto:ismaelgardelamo@gmail.com">
                ismaelgardelamo@gmail.com
            </a>
        </p>
    </footer>

</body>
