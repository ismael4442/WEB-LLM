<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Piedra, papel o tijera</title>

    <link rel="stylesheet" href="CSS/juego.css">
    <script src="JS/juego.js"></script>
</head>

<body>

    <header>
        <h1>Mi instituto</h1>

        <nav>
            <a href="jsinicio.html">Inicio JavaScript</a>
        </nav>
    </header>

    <main>
        <div class="juego">

            <h1>Piedra, papel o tijera</h1>
            <p class="instrucciones">Elige una opción y juega contra la máquina</p>

            <div class="opciones">
                <button type="button" onclick="juego('piedra')">✊ Piedra</button>
                <button type="button" onclick="juego('papel')">✋ Papel</button>
                <button type="button" onclick="juego('tijera')">✌️ Tijera</button>
            </div>

            <div class="marcador">
                <h2>Estadísticas</h2>

                <p id="marcador">Partidas jugadas: 0</p>
                <p id="ganadas">Ganadas: 0</p>
                <p id="empatadas">Empates: 0</p>
                <p id="perdidas">Derrotas: 0</p>
            </div>

            <section id="resultado">
                <h2>Resultado</h2>
                <p id="jugada-jugador">Tu jugada aparecerá aquí</p>
                <p id="jugada-maquina">La jugada de la máquina aparecerá aquí</p>
                <p id="mensaje"></p>
            </section>

        </div>
    </main>

</body>
</html>
